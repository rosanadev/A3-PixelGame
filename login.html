<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelGame - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <nav class="navigation">
        <a href="/"><img src="assets/logo-horizontal.png"></a>
        <form>
            <input type="text" placeholder="Pesquisar jogo..." class="search-bar" name="search" id="search">
            <input type="submit" style="display:none">
        </form>
        <div class="btn-container">
            <button class="btn-icon">A</button>
            <button class="btn-icon">B</button>
            <button class="btn-purple">Entrar</button>
        </div>
        </nav>
    </header>
    <main>
        <div class="container">
        <div class="column">
            <img src="assets/logo-vertical.png" class="main-logo">
        </div>
        <div class="column">
            <h1 class="greeting">Bem-vindo de volta!</h1>
            <h2>Conecte-se com seu email</h2>
            <input class="email-input" placeholder="exemplo@email.com">
        </div>
        </div>
    </main>
</body>
</html>
