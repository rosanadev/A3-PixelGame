<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelGame - Login</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>
<body>
    <header class="header">
        <nav class="navigation">
            <a href="/"><img src="assets/logo-horizontal.png"></a>
        <form>
            <input type="text" placeholder="Pesquisar jogo..." class="search-bar" name="search" id="search">
            <input type="submit" style="display:none">
        </form>
        <div class="btn-container">
            <button class="btn-purple">Entrar</button>
        </div>
        </nav>
    </header>
    <main>
        <div class="container">
        <div class="column">
            <img src="assets/logo-vertical.png" class="main-logo">
        </div>
        <div class="column">
            <form class="login-form" action="/" method="POST">
            <h1 class="greeting">Bem-vindo de volta!</h1>
            <h2>Conecte-se com seu email</h2>
            <input class="email-input" placeholder="exemplo@email.com" type="email" required>
            <button type="submit" class="login-button">Login</button>
            </form>
            <div class="line"></div>
            <p>ou continue com:</p>
            <div class="social-login">
                <button class="social-button"><i class="fa-brands fa-google"></i><span>Google</span></button>
                <button class="social-button"><i class="fa-brands fa-facebook"></i>Facebook</button>
            </div>
        </div>
        </div>
    </main>
</body>
</html>
