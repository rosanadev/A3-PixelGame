<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="initial-scale=1, width=device-width" />

    <link rel="stylesheet" href="./global.css" />
    <link rel="stylesheet" href="./index.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Iosevka Charon:wght@400&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap"
    />
  </head>
  <body>
    <div class="carrinho-de-compras">
      <header class="frame-header">
        <div class="frame-wrapper2">
          <div class="bottom-app-bar-group">
            <div class="bottom-app-bar2">
              <div class="leading-icon2">
                <button class="icon-12">
                  <button class="container2">
                    <div class="state-layer3">
                      <img class="icon8" alt="" src="./public/Icon.svg" />
                    </div>
                  </button>
                </button>
              </div>
              <div class="fab-elevation-override2">
                <div class="deprecated-fab2">
                  <div class="state-layer4">
                    <img class="icon8" alt="" src="./public/icon1.svg" />
                  </div>
                </div>
              </div>
            </div>
            <div class="action-buttons">
              <button class="boto-corao2">
                <button class="heart2">
                  <img class="icon10" alt="" src="./public/Icon2.svg" />
                </button>
                <button class="button12">
                  <button class="shopping-cart5">
                    <img class="icon11" alt="" src="./public/Icon3.svg" />
                  </button>
                  <img class="plus-icon4" alt="" src="./public/Plus.svg" />

                  <img class="x-icon8" alt="" src="./public/X.svg" />
                </button>
              </button>
              <div class="cart-button-area">
                <button class="boto-corao2">
                  <button class="button13">
                    <button class="shopping-cart5">
                      <img class="icon11" alt="" src="./public/Icon3.svg" />
                    </button>
                    <img class="plus-icon4" alt="" src="./public/Plus.svg" />

                    <img class="x-icon8" alt="" src="./public/X.svg" />
                  </button>
                  <button class="shopping-cart7">
                    <img class="icon13" alt="" src="./public/Icon3.svg" />
                  </button>
                </button>
              </div>
              <button class="button14">
                <img class="x-icon8" alt="" src="./public/Star.svg" />

                <div class="button15">Entrar</div>
                <img class="x-icon8" alt="" src="./public/X.svg" />
              </button>
            </div>
          </div>
        </div>
        <div class="line-div"></div>
      </header>
      <main class="a9dd0a120391f4148c1daef072e9be-parent">
        <img
          class="a9dd0a120391f4148c1daef072e9be-icon"
          alt=""
          src="./public/a9dd0a120391f4148c1daef072e9be45-1-1@2x.png"
        />

        <section class="background-rect"></section>
        <img class="logo-icon2" alt="" src="./public/Logo.svg" />

        <img
          class="pixelgame-logo-minimal-1-icon3"
          alt=""
          src="./public/pixelgame-logo-minimal-1@2x.png"
        />
      </main>
      <div class="cart-title">
        <h1 class="carrinho-de-compras2">Carrinho de Compras</h1>
      </div>
      <main class="product-details">
        <div class="frame-parent4">
          <section class="rectangle-parent">
            <div class="rectangle-div"></div>
            <img
              class="image-4-icon2"
              loading="lazy"
              alt=""
              src="./public/image-42@2x.png"
            />

            <div class="frame-wrapper3">
              <div class="frame-parent5">
                <div class="the-sims-4-parent">
                  <h2 class="the-sims-42">The Sims 4</h2>
                  <div class="quantity-buttons-wrapper">
                    <div class="quantity-buttons">
                      <div class="quantity-row">
                        <button class="button16">
                          <img class="x-icon8" alt="" src="./public/Star.svg" />

                          <div class="button17">Simulação</div>
                          <img class="x-icon8" alt="" src="./public/X.svg" />
                        </button>
                      </div>
                      <div class="amount-buttons">
                        <div class="counter-row-parent">
                          <div class="counter-row">
                            <img
                              class="vector-icon2"
                              alt=""
                              src="./public/Vector.svg"
                            />

                            <b class="counter-value">1</b>
                          </div>
                          <div class="counter-combined">
                            <img
                              class="vector-icon3"
                              alt=""
                              src="./public/Vector1.svg"
                            />

                            <button class="vector-parent">
                              <img
                                class="vector-icon2"
                                alt=""
                                src="./public/Vector.svg"
                              />

                              <img
                                class="vector-icon5"
                                alt=""
                                src="./public/Vector2.svg"
                              />
                            </button>
                            <button class="vector-group">
                              <img
                                class="vector-icon2"
                                alt=""
                                src="./public/Vector.svg"
                              />

                              <img
                                class="vector-icon7"
                                alt=""
                                src="./public/Vector3.svg"
                              />

                              <img
                                class="vector-icon8"
                                alt=""
                                src="./public/Vector2.svg"
                              />
                            </button>
                          </div>
                        </div>
                      </div>
                      <div class="price-display">
                        <div class="frame-parent6">
                          <div class="subtotal-wrapper">
                            <h3 class="subtotal">Subtotal</h3>
                          </div>
                          <h2 class="r-40000">R$ 400,00</h2>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
                <div class="remove-item">
                  <div class="remove-container">
                    <img
                      class="vector-icon3"
                      alt=""
                      src="./public/Vector4.svg"
                    />

                    <div class="remover">Remover</div>
                  </div>
                </div>
              </div>
            </div>
          </section>
          <section class="order-summary">
            <div class="order-info-column">
              <h3 class="resumo-do-pedido">Resumo do Pedido</h3>
              <div class="the-sims-4-1-parent">
                <div class="the-sims-43">The Sims 4 ×1</div>
                <div class="r-400002">R$ 400,00</div>
              </div>
            </div>
            <div class="a9dd0a120391f4148c1daef072e9be-parent">
              <img
                class="delivery-icon"
                alt=""
                src="./public/Delivery-Icon.svg"
              />

              <img class="vector-icon10" alt="" src="./public/Vector2.svg" />

              <img class="vector-icon11" alt="" src="./public/Vector2.svg" />
            </div>
            <div class="total-display-parent">
              <div class="total-display">
                <h3 class="total">Total</h3>
                <b class="r-400003">R$ 400,00</b>
              </div>
              <div class="checkout-actions">
                <div class="action-container">
                  <img
                    class="checkout-button-icon"
                    alt=""
                    src="./public/Checkout-Button.svg"
                  />

                  <h3 class="finalizar-compra">Finalizar Compra</h3>
                </div>
                <div class="action-container2">
                  <img
                    class="checkout-button-icon"
                    alt=""
                    src="./public/Checkout-Button.svg"
                  />

                  <h3 class="continuar-comprando">Continuar Comprando</h3>
                </div>
              </div>
            </div>
          </section>
        </div>
      </main>
    </div>
  </body>
</html>
