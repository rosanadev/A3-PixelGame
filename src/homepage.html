<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="initial-scale=1, width=device-width" />

    <link rel="stylesheet" href="./global.css" />
    <link rel="stylesheet" href="./index.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Iosevka Charon:wght@400&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Average:wght@400&display=swap"
    />
  </head>
  <body>
    <div class="homepage">
      <header class="frame-parent">
        <div class="bottom-app-bar-parent">
          <div class="bottom-app-bar">
            <div class="leading-icon">
              <button class="icon-1">
                <button class="container">
                  <div class="state-layer">
                    <img class="icon" alt="" src="./public/Icon.svg" />
                  </div>
                </button>
              </button>
            </div>
            <div class="fab-elevation-override">
              <div class="deprecated-fab">
                <div class="state-layer2">
                  <img class="icon" alt="" src="./public/icon1.svg" />
                </div>
              </div>
            </div>
          </div>
          <div class="boto-corao-parent">
            <button class="boto-corao">
              <button class="heart">
                <img class="icon3" alt="" src="./public/Icon2.svg" />
              </button>
              <button class="button">
                <button class="shopping-cart">
                  <img class="icon4" alt="" src="./public/Icon3.svg" />
                </button>
                <img class="plus-icon" alt="" src="./public/Plus.svg" />

                <img class="x-icon" alt="" src="./public/X.svg" />
              </button>
            </button>
            <div class="boto-carrinho-wrapper">
              <button class="boto-corao">
                <button class="button2">
                  <button class="shopping-cart">
                    <img class="icon4" alt="" src="./public/Icon3.svg" />
                  </button>
                  <img class="plus-icon" alt="" src="./public/Plus.svg" />

                  <img class="x-icon" alt="" src="./public/X.svg" />
                </button>
                <button class="shopping-cart3">
                  <img class="icon6" alt="" src="./public/Icon3.svg" />
                </button>
              </button>
            </div>
            <button class="button3">
              <img class="x-icon" alt="" src="./public/Star.svg" />

              <div class="button4">Entrar</div>
              <img class="x-icon" alt="" src="./public/X.svg" />
            </button>
          </div>
        </div>
        <div class="line-wrapper">
          <div class="frame-child"></div>
        </div>
      </header>
      <div class="logo-parent">
        <img class="logo-icon" alt="" src="./public/Logo.svg" />

        <img
          class="pixelgame-logo-minimal-1-icon"
          alt=""
          src="./public/pixelgame-logo-minimal-1@2x.png"
        />
      </div>
      <main class="fundo-parent">
        <section class="fundo">
          <img class="halo2-1-icon" alt="" src="./public/halo2-1@2x.png" />

          <div class="background-rect"></div>
          <section class="button-parent">
            <div class="button5">
              <img class="x-icon" alt="" src="./public/Star.svg" />

              <div class="button6">Destaque da semana</div>
              <img class="x-icon" alt="" src="./public/X.svg" />
            </div>
            <b class="horizon-zero-dawn-container">
              <span>Horizon Zero Dawn Remastered<br /></span>
              <span class="mais-realismo-para"
                >Mais realismo <br />para você!</span
              >
            </b>
          </section>
          <div class="button7">
            <img class="x-icon" alt="" src="./public/Star.svg" />

            <h3 class="button8">Popular</h3>
            <img class="x-icon" alt="" src="./public/X.svg" />
          </div>
        </section>
        <div class="image-1-parent">
          <img
            class="image-1-icon"
            loading="lazy"
            alt=""
            src="./public/image-1@2x.png"
          />

          <h1 class="resident-evil-requiem">Resident evil requiem</h1>
        </div>
        <div class="fortnite">
          <img
            class="fortnite-icon"
            loading="lazy"
            alt=""
            src="./public/fortnite@2x.png"
          />

          <h2 class="the-last-of">Fortnite</h2>
        </div>
        <div class="the-last-of-us">
          <img
            class="fortnite-icon"
            loading="lazy"
            alt=""
            src="./public/image-3@2x.png"
          />

          <h2 class="the-last-of">The last of us</h2>
        </div>
        <div class="the-sims-4">
          <img
            class="fortnite-icon"
            loading="lazy"
            alt=""
            src="./public/image-4@2x.png"
          />

          <h2 class="the-last-of">The Sims 4</h2>
        </div>
        <div class="stardew-valley">
          <img
            class="fortnite-icon"
            loading="lazy"
            alt=""
            src="./public/image-5@2x.png"
          />

          <h2 class="stardew-valley2">Stardew valley</h2>
        </div>
      </main>
    </div>
  </body>
</html>
